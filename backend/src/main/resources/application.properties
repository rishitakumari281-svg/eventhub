spring.application.name=eventhub
server.port=8080

# ---- Local secrets file (optional, git-ignored). Spring Boot does NOT read ".env" files by itself;
# this line makes it read backend/.env if that file exists, so credentials survive new terminals.
# The [.properties] hint is REQUIRED for a file named ".env". Real environment variables still win over it.
# Create the file with:  bash configure-env.sh   (see .env.example for the format)
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# ---- Database (MySQL). Credentials come from environment variables or .env, never from this file.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# 'update' creates/updates tables automatically: convenient for a hackathon.
# For production you would use 'validate' plus migrations (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Security. JWT_SECRET has NO default: the app refuses to start without it.
eventhub.jwt.secret=${JWT_SECRET}
eventhub.jwt.ttl-minutes=120
eventhub.cors.allowed-origins=http://localhost:5173

# ---- Optional demo data (events + 3 demo accounts). Off unless SEED_DEMO=true.
eventhub.seed.enabled=${SEED_DEMO:false}
eventhub.seed.password=${SEED_PASSWORD:}

# Do not leak internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
